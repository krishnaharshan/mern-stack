<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0;
            padding:0;
        }
        .container{
            background-color: #ffff;
            border:3px solid black;
            margin: 20px;
            padding: 10px;
        }
        .grid-container{
            display: grid;
            background-color: #ddd;
            gap: 10px;
            padding: 10px;
            margin-bottom: 10px;

        }
        .box{
            padding: 20px;
            color: white;
            font-size: 18px;
            background-color: #3498db;
            text-align: center;
        }
        .box:nth-child(even){
            background-color: red;
        }
    </style>
</head>
<body>
    <h1>Grid Masterclass</h1>
    <div class="container">
        <h2>1.Basic Grid(3x3)</h2>
        <div class="grid-container" style="grid-template-columns: repeat(3,1fr);">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
            <div class="box">4</div>
            <div class="box">5</div>
            <div class="box">6</div>
            <div class="box">7</div>
            <div class="box">8</div>
            <div class="box">9</div>
        </div>
    </div>

    <div class="container">
        <h2>2. grid with different colums sizes</h2>
        <div class="grid-container" style="grid-template-columns: 1fr 2fr 1fr;">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
        </div>
    </div>
        <div class="container">
        <h2>3.Grip gap</h2>
        <div class="grid-container" style="gap: 20px; grid-template-columns: repeat(3,1fr);">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
            <div class="box">4</div>
            <div class="box">5</div>
            <div class="box">6</div>
        </div>
    </div>
    <div class="container">
        <h2>4.Grid item Placement</h2>
        <div class="grid-container" 
        style="
         grid-template-columns: repeat(3,1fr);
         grid-template-rows: 100px 100px 100px;
         "
        >
            <div class="box"
             style=
             "grid-column: 1/3;
             grid-row: 1/3;
             "
             >1</div>
            <div class="box">2</div>
            <div class="box"
            style="
            /* grid-row: 2/4; */
            "
            >3</div>
            <div class="box">4</div>

            <div class="box" 
            style="
            grid-column: 2/4;
            "
            >5</div>
        </div>
    </div>
    <div class="container">
        <h2>5.Grid template areas</h2>
        <div class="grid-container"
        style="
        grid-template-areas: 'Header Header Header' 
                                'sidebar main main' 
                              'Footer Footer Footer';
        "
        >
            <div class="box Header"  style="grid-area: Header ;">Header</div>
            <div class="box sidebar" style="grid-area: sidebar ;">sidebar</div>
            <div class="box main" style="grid-area: main;">Main Content</div>
            <div class="box Footer" style="grid-area: Footer;">Footer</div>
        </div>
    </div>

        </div>
        <div class="container">
        <h2>3.Grip auto-fit and minmax</h2>
        <div class="grid-container" style="
        grid-template-columns: repeat(auto-fit,minmax(100px,1fr));
        ">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
            <div class="box">4</div>
            <div class="box">5</div>
            <div class="box">6</div>
        </div>
    </div>
</body>
</html>
